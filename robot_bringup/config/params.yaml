core_node:
  ros__parameters:
    steering_center: 0.0
    steering_input_max: 100.0
    steering_deadband: 5.0
    throttle_center: 0.0
    throttle_input_max: 100.0
    throttle_deadband: 5.0
    max_steer_angle_deg: 90.0
    
    buzzer_pin: 18
    led_pin: 23

relay_node:
  ros__parameters:
    bus_id: 1
    device_name: sx1509_gpio
    device_type: gpio_expander
    description: SX1509 GPIO expander on the root I2C bus
    device_address: 62
    use_mux: false
    mux_address: 0
    mux_channel: 0
    active_low: true
    ignition_pin: 0
    topic_name: /robot/relay


    reverse_pin1: 1
    reverse_pin2: 2
    reverse_pin3: 3
    reverse_pin4: 13

    brake_pin: 12
    back_energy: 14
    alarm_lamp: 15

    active_low: true

robot_rc_node:
  ros__parameters:
    topic_name: /rc/input
    serial_port: /dev/ttyUSB0
    serial_baud: 115200
    serial_timeout: 0.5
    read_hz: 10.0

encoder_node:
  ros__parameters:
    device_name: AS5600
    device_type: magnetic_encoder
    description: 4 magnetic encoder on mux1
    device_address: 54
    use_mux: true
    mux_address: 112
    frequency: 10
    motor1_sd: 4
    motor2_sd: 5
    motor3_sd: 6
    motor4_sd: 7

steer_node:
  ros__parameters:
    device_name: pca9685_pwm
    bus_id: 1
    device_address: 64
    frequency: 50
    drive_pulse_1: 3000
    drive_pulse_2: 3000
    drive_pulse_3: 3800
    drive_pulse_4: 3000
    deadband_deg: 2.0
    control_frequency: 10.0
    encoder_timeout_sec: 0.5
    max_steer_angle_deg: 60.0
    fake_pid: 10.0 
    database_listen_client: /database/encoder_zero_get
    encoder_listen_topic: /robot/steering_encoders
    core_listen_topic: /robot/steer

    front_left_reverse_pin: 4
    front_left_forward_pin: 5

    front_right_reverse_pin: 0
    front_right_forward_pin: 1

    rear_left_reverse_pin: 6
    rear_left_forward_pin: 7

    rear_right_reverse_pin: 2
    rear_right_forward_pin: 3

compass_node:
  ros__parameters:
    device_name: compass
    device_type: magnetometer
    description: Main chassis compass on the root I2C bus
    bus_id: 1
    device_address: 30
    use_mux: false
    frequency: 10

hubmotor_node:
  ros__parameters:
    topic: /robot/hub_motor
    device_name: mcp4725
    bus_id: 1
    min_dac_value: 0
    max_dac_value: 4095
    control_frequency: 1.0
    use_mux: true
    mux_address: 113
    primary_address: 96
    secondary_address: 97
    max_power_percentage: 100

    front_left_mux_channel: 2
    front_right_mux_channel: 3
    rear_left_mux_channel: 4
    rear_right_mux_channel: 5

gnss_node:
  ros__parameters:
    serial_port: /dev/serial/by-id/usb-u-blox_AG_-_www.u-blox.com_u-blox_GNSS_receiver-if00
    baudrate: 460800
    serial_timeout_s: 0.2
    measurement_rate_hz: 10.0
    publish_period_s: 0.1
    log_period_s: 1.0

telemetry_node:
  ros__parameters:
    serial_port: /dev/serial/by-id/usb-Silicon_Labs_CP2102_USB_to_UART_Bridge_Controller_0001-if00-port0
    baudrate: 460800
    serial_timeout_s: 0.1
    reconnect_delay_s: 2.0
    write_idle_sleep_s: 0.01
    status_hz: 1.0
    status_topic: /robot/status
    rtcm_topic : /station/rtcm
    command_topic: /user/command
    mission_topic: /user/mission
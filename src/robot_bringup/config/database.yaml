database_node:
  ros__parameters:
    db_path: "~/.ros/robot_brain.db"

    tables_json: |
      {
        "encoder_zero_raw": {
          "columns": [
            {"name": "id", "type": "INTEGER PRIMARY KEY"},
            {"name": "motor1", "type": "INTEGER", "default": 0},
            {"name": "motor2", "type": "INTEGER", "default": 0},
            {"name": "motor3", "type": "INTEGER", "default": 0},
            {"name": "motor4", "type": "INTEGER", "default": 0}
          ]
        },
        "mission": {
          "columns": [
            {"name": "id", "type": "INTEGER PRIMARY KEY"},
            {"name": "mission_id", "type": "INTEGER", "default": 0},
            {"name": "receive_date", "type": "TEXT", "default": ""},
            {"name": "raw_json", "type": "TEXT", "default": ""},
            {"name": "last_waypoint", "type": "INTEGER", "default": 0}
          ]
        }
      }

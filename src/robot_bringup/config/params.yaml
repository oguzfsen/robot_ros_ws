/**:
  ros__parameters:
    # robot dimensions
    wheelbase: 1.6
    wheel_track: 1.4
    wheel_diameter: 0.4

    # robot deadbands
    speed_limit: 1.5
    steer_input_deadband: 5
    steer_input_max: 100
    steer_max: 60  #-100,100 => -60,60 arasına maplanıyor.
    throttle_deadband: 5
    throttle_input_max: 100
    throttle_max: 60  #0,100 => 0,60 arasına maplanıyor.

    # frequencies & timeouts
    control_frequency: 10.0
    publish_frequency: 10.0
    watchdog_frequency: 1.0
    command_timeout_sec: 0.5

    # topics
    topic_average_steering: /robot/average_steering
    topic_brake: /robot/brake
    topic_compass: /robot/compass
    topic_encoder: /robot/encoder
    topic_emergency: /robot/emergency
    topic_gnss: /robot/gnss
    topic_hub_motor: /robot/hub_motor
    topic_malfunction: /robot/malfunction
    topic_mission_state: /robot/mission_state
    topic_rc_input: /rc/input
    topic_relay: /robot/relay
    topic_status: /robot/status
    topic_state: /robot/state
    topic_steer: /robot/steer
    topic_motion: /robot/motion

    topic_command: /user/command
    topic_mission: /user/mission
    topic_rtcm: /station/rtcm

    topic_enc_zero_get: /database/encoder_zero_get
    topic_enc_zero_set: /database/encoder_zero_set
    topic_mission_get: /database/mission_get
    topic_mission_set: /database/mission_set

    # ortak pinler
    steer_front_left_reverse: 5
    steer_front_left_forward: 4
    steer_front_right_reverse: 1
    steer_front_right_forward: 0
    steer_rear_left_reverse: 7
    steer_rear_left_forward: 6
    steer_rear_right_reverse: 3
    steer_rear_right_forward: 2

    encoder1: 4
    encoder2: 5
    encoder3: 6
    encoder4: 7

core_node:
  ros__parameters:
    buzzer_pin: 18
    led_pin: 23

relay_node:
  ros__parameters:
    device_name: sx1509_gpio
    device_address: 62
    use_mux: false
    mux_address: 0
    mux_channel: 0

    ignition_pin: 0
    reverse_pin1: 1
    reverse_pin2: 2
    reverse_pin3: 3
    reverse_pin4: 13
    brake_pin: 12
    back_energy: 14
    alarm_lamp: 15

rc_node:
  ros__parameters:    
    serial_port: "/dev/serial/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.2:1.0-port0"
    serial_baud: 115200
    serial_timeout: 0.5

encoder_node:
  ros__parameters:
    device_name: AS5600
    device_address: 54
    use_mux: true
    mux_address: 112


steer_node:
  ros__parameters:
    device_name: pca9685_pwm
    device_address: 64
    pwm_frequency: 50
    drive_pulse_1: 3000
    drive_pulse_2: 3000
    drive_pulse_3: 3000
    drive_pulse_4: 3000
    deadband_deg: 2.0
    encoder_timeout_sec: 0.5
    encoder_zero_db_serv_timeout: 5.0
    # bu rc input değil hem target hemde current açıya sınır koyuyor.
    max_steer_angle_deg: 30.0
    # yukarıdaki sınır + margin = 35 aşılırsa malfunction
    steer_angle_safety_margin_deg: 5.0
    fake_pid: 10.0 
    no_response_duration_s: 3.0


compass_node:
  ros__parameters:
    device_name: compass
    device_address: 30
    use_mux: false

hubmotor_node:
  ros__parameters:
    device_name: mcp4725
    min_dac_value: 0
    max_dac_value: 4095
    use_mux: true
    mux_address: 113
    primary_address: 96
    secondary_address: 97
    max_power_percentage: 100

    front_left_mux_channel: 2
    front_right_mux_channel: 3
    rear_left_mux_channel: 4
    rear_right_mux_channel: 5

gnss_rover_node:
  ros__parameters:
    serial_port: /dev/serial/by-id/usb-u-blox_AG_-_www.u-blox.com_u-blox_GNSS_receiver-if00
    baudrate: 460800
    serial_timeout_s: 0.2
    measurement_rate_hz: 10.0
    publish_period_s: 0.1

signalr_node:
  ros__parameters:
    robot_id: UTAEMBOT
    hub_url: https://gorev-yonetici.com/robotHub
    send_method_name: SendMessage
    receive_method_name: ReceiveMessage
    reconnect_delay_s: 1.0
    poll_timeout_s: 15.0
    http_timeout_s: 15.0
    status_period_s: 1.0


brake_node:
  ros__parameters:
    serial_port: "/dev/serial/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.4:1.0-port0"
    baudrate: 115200
    stroke_max: 250

steer_zero_node:
  ros__parameters:
    steering_slow_pulse: 2000

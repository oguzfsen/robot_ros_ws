core_node:
  ros__parameters:
    steer_input_deadband: 5
    steer_input_max: 100
    steer_max: 60
    throttle_deadband: 10
    throttle_input_max: 100
    throttle_max: 60

    topic_rc_input: /rc/input
    topic_gnss: /robot/gnss
    topic_command: /user/command
    topic_relay: /robot/relay
    topic_steer: /robot/steer
    topic_hub_motor: /robot/hub_motor
    topic_brake: /robot/brake
    topic_malfunction: /robot/malfunction
    topic_emergency: /robot/emergency
    topic_average_steering: /robot/average_steering
    topic_mission_get: /database/mission_get
    topic_compass: /robot/compass

    compass_real_north_heading: 20.0
    
    update_hz: 10    
    buzzer_pin: 18
    led_pin: 23

    wheelbase: 1.6
    wheel_track: 1.4
    wheel_diameter: 0.4

relay_node:
  ros__parameters:
    bus_id: 1
    device_name: sx1509_gpio
    device_type: gpio_expander
    description: SX1509 GPIO expander on the root I2C bus
    device_address: 62
    use_mux: false
    mux_address: 0
    mux_channel: 0
    active_low: true
    ignition_pin: 0
    topic_name: /robot/relay


    reverse_pin1: 1
    reverse_pin2: 2
    reverse_pin3: 3
    reverse_pin4: 13

    brake_pin: 12
    back_energy: 14
    alarm_lamp: 15

    active_low: true

rc_node:
  ros__parameters:
    topic_name: /rc/input
    serial_port: "/dev/serial/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.2:1.0-port0"
    serial_baud: 115200
    serial_timeout: 0.5
    read_hz: 10.0

encoder_node:
  ros__parameters:
    device_name: AS5600
    device_type: magnetic_encoder
    description: 4 magnetic encoder on mux1
    device_address: 54
    use_mux: true
    mux_address: 112
    frequency: 10
    motor1_sd: 4
    motor2_sd: 5
    motor3_sd: 6
    motor4_sd: 7

steer_node:
  ros__parameters:
    device_name: pca9685_pwm
    bus_id: 1
    device_address: 64
    frequency: 50
    drive_pulse_1: 3000
    drive_pulse_2: 3000
    drive_pulse_3: 3000
    drive_pulse_4: 3000
    deadband_deg: 2.0
    control_frequency: 10.0
    encoder_timeout_sec: 0.5
    encoder_zero_response_timeout_sec: 2.0
    encoder_zero_startup_wait_sec: 20.0
    max_steer_angle_deg: 60.0
    fake_pid: 10.0 
    no_response_duration_s: 3.0
    malfunction_topic: /robot/malfunction
    database_listen_client: /database/encoder_zero_get
    encoder_listen_topic: /robot/steering_encoders
    core_listen_topic: /robot/steer

    front_left_reverse_pin: 4
    front_left_forward_pin: 5

    front_right_reverse_pin: 0
    front_right_forward_pin: 1

    rear_left_reverse_pin: 6
    rear_left_forward_pin: 7

    rear_right_reverse_pin: 2
    rear_right_forward_pin: 3

compass_node:
  ros__parameters:
    device_name: compass
    device_type: magnetometer
    description: Main chassis compass on the root I2C bus
    bus_id: 1
    device_address: 30
    use_mux: false
    frequency: 10

hubmotor_node:
  ros__parameters:
    topic: /robot/hub_motor
    device_name: mcp4725
    bus_id: 1
    min_dac_value: 0
    max_dac_value: 4095
    control_frequency: 1.0
    use_mux: true
    mux_address: 113
    primary_address: 96
    secondary_address: 97
    max_power_percentage: 100
    command_timeout_sec: 0.5
    watchdog_frequency: 10.0

    front_left_mux_channel: 2
    front_right_mux_channel: 3
    rear_left_mux_channel: 4
    rear_right_mux_channel: 5

gnss_rover_node:
  ros__parameters:
    serial_port: /dev/serial/by-id/usb-u-blox_AG_-_www.u-blox.com_u-blox_GNSS_receiver-if00
    baudrate: 460800
    serial_timeout_s: 0.2
    measurement_rate_hz: 10.0
    publish_period_s: 0.1
    log_period_s: 5.0
    rtcm_topic: /station/rtcm

signalr_node:
  ros__parameters:
    robot_id: UTAEMBOT
    hub_url: https://gorev-yonetici.com/robotHub
    send_method_name: SendMessage
    receive_method_name: ReceiveMessage
    reconnect_delay_s: 1.0
    poll_timeout_s: 15.0
    http_timeout_s: 15.0
    status_period_s: 1.0
    status_send_wait_s: 0.0
    database_mission_set_service: /database/mission_set
    state_topic: /robot/state
    gnss_topic: /robot/gnss
    mission_state_topic: /robot/mission_state
    signalr_command_topic: /user/command
    signalr_mission_topic: /user/mission
    signalr_status_topic: /robot/status
    signalr_rtcm_topic: /station/rtcm
    signalr_station_status_topic: /station/status
    rtcm_topic: /station/rtcm
    status_topic: /robot/status
    command_topic: /user/command


brake_node:
  ros__parameters:
    serial_port: "/dev/serial/by-path/platform-fd500000.pcie-pci-0000:01:00.0-usb-0:1.4:1.0-port0"
    baudrate: 115200
    stroke_max: 250
    topic_brake: /robot/brake
